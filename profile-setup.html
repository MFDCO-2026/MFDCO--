<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        プロフィール登録 | MFDCO
    </title>

    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/auth.css">

</head>

<body>


    <div id="header-container"></div>


    <main>

        <section class="join-page">

            <div class="join-container">

                <div class="join-panel active">

                    <p class="section-label">
                        PROFILE SETUP
                    </p>

                    <h1>
                        プロフィール登録
                    </h1>


                    <p class="form-note">
                        メールアドレスの確認が完了しました。
                        MFDCOで使用するプロフィールを登録してください。
                    </p>


                    <div
                        id="profile-loading"
                        class="form-section"
                    >

                        <p>
                            アカウント情報を確認しています...
                        </p>

                    </div>


                    <form
                        id="profile-setup-form"
                        hidden
                    >


                        <!-- PROFILE -->

                        <div class="form-section">

                            <h2>
                                プロフィール
                            </h2>


                            <div class="form-group">

                                <label for="activity-name">
                                    活動名
                                    <span>*</span>
                                </label>

                                <input
                                    type="text"
                                    id="activity-name"
                                    name="activity_name"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label>
                                    アイコン
                                    <span>*</span>
                                </label>

                                <div class="image-upload">

                                    <input
                                        type="file"
                                        id="icon"
                                        name="icon"
                                        accept="image/jpeg,image/png,image/webp"
                                        required
                                    >

                                    <img
                                        id="icon-preview"
                                        alt=""
                                    >

                                </div>

                                <p class="form-note">
                                    1:1の画像を推奨します。
                                    JPEG・PNG・WebP、5MB以下。
                                </p>

                            </div>


                            <div class="form-group">

                                <label for="fictional-country">
                                    架空国名
                                </label>

                                <input
                                    type="text"
                                    id="fictional-country"
                                    name="fictional_country"
                                >

                            </div>


                            <div class="form-group">

                                <label>
                                    国旗
                                </label>

                                <div class="image-upload">

                                    <input
                                        type="file"
                                        id="flag"
                                        name="flag"
                                        accept="image/jpeg,image/png,image/webp"
                                    >

                                    <img
                                        id="flag-preview"
                                        alt=""
                                    >

                                </div>

                                <p class="form-note">
                                    任意。
                                    JPEG・PNG・WebP、5MB以下。
                                </p>

                            </div>

                        </div>



                        <!-- CREDIT -->

                        <div class="form-section">

                            <h2>
                                クレジット表記
                            </h2>


                            <div class="radio-list">

                                <label>

                                    <input
                                        type="radio"
                                        name="credit-type"
                                        value="none"
                                        required
                                    >

                                    不要

                                </label>


                                <label>

                                    <input
                                        type="radio"
                                        name="credit-type"
                                        value="optional"
                                    >

                                    任意

                                </label>


                                <label>

                                    <input
                                        type="radio"
                                        name="credit-type"
                                        value="custom"
                                    >

                                    指定する

                                </label>

                            </div>


                            <textarea
                                id="credit-text"
                                name="credit_text"
                                disabled
                                placeholder="希望するクレジット表記"
                            ></textarea>

                        </div>



                        <!-- TAGS -->

                        <div class="form-section">

                            <h2>
                                タグ
                            </h2>

                            <p class="form-note">
                                あなたの活動に当てはまるものを
                                選択してください。
                            </p>


                            <div class="tag-list">

                                <label>
                                    <input type="checkbox" name="tags" value="Youtuber">
                                    Youtuber
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="BE">
                                    BE
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="JE 1.7.10">
                                    JE 1.7.10
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="JE 最新">
                                    JE 最新
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="回路勢">
                                    回路勢
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="造形勢">
                                    造形勢
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="mod">
                                    mod
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="陸軍">
                                    陸軍
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="海軍">
                                    海軍
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="空軍">
                                    空軍
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="歩兵">
                                    歩兵
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="現代・近未来">
                                    現代・近未来
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="WW2">
                                    WW2
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="WW1">
                                    WW1
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="産業革命前">
                                    産業革命前
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="超未来">
                                    超未来
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="再現">
                                    再現
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="架空兵器">
                                    架空兵器
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="コラボ歓迎">
                                    コラボ歓迎
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="交流歓迎">
                                    交流歓迎
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="国家運営">
                                    国家運営
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="同盟歓迎">
                                    同盟歓迎
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="画像制作">
                                    画像制作
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="動画制作">
                                    動画制作
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="音楽制作">
                                    音楽制作
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="Blender">
                                    Blender
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="イラスト制作">
                                    イラスト制作
                                </label>

                                <label>
                                    <input type="checkbox" name="tags" value="プログラミング">
                                    プログラミング
                                </label>

                            </div>

                        </div>



                        <!-- BIO -->

                        <div class="form-section">

                            <h2>
                                自由記述
                            </h2>

                            <textarea
                                name="bio"
                                rows="6"
                                placeholder="自己紹介やMFDCOでやりたいことなど"
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="join-submit"
                        >
                            プロフィールを登録する
                        </button>


                    </form>


                    <div
                        id="profile-error"
                        class="form-section"
                        hidden
                    >

                        <h2>
                            プロフィール登録を開始できません
                        </h2>

                        <p id="profile-error-message"></p>

                        <a
                            href="join.html"
                            class="join-submit"
                        >
                            ログイン画面へ
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <div id="footer-container"></div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/profile-setup.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
