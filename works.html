<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        提供作品 | MFDCO
    </title>

    <meta
        name="description"
        content="MFDCOメンバーが制作・提供する作品を掲載しています。"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/works.css"
    >

</head>


<body>


    <!-- =========================================
         COMMON HEADER
    ========================================== -->

    <div id="header-container"></div>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="works-page">


        <!-- =====================================
             PAGE TITLE
        ====================================== -->

        <section class="works-hero">

            <p class="page-number">
                MFDCO WORKS
            </p>


            <h1>
                提供作品
            </h1>


            <p class="works-introduction">
                MFDCOメンバーが制作・提供する作品を掲載しています。<br>
                気になる作品を探してみてください。
            </p>

        </section>



        <!-- =====================================
             SEARCH / FILTER
        ====================================== -->

        <section class="works-controls">


            <div class="controls-top">


                <!-- =============================
                     SEARCH
                ============================== -->

                <div class="search-box">

                    <label for="search">
                        作品を検索
                    </label>


                    <div class="search-input-wrap">

                        <span class="search-icon">
                            🔍
                        </span>


                        <input
                            type="search"
                            id="search"
                            placeholder="作品名・説明・作者名で検索"
                            autocomplete="off"
                        >

                    </div>

                </div>



                <!-- =============================
                     SORT
                ============================== -->

                <div class="sort-box">

                    <label for="sort">
                        並べ替え
                    </label>


                    <select id="sort">

                        <option value="newest">
                            新しい順
                        </option>

                        <option value="oldest">
                            古い順
                        </option>

                        <option value="name-asc">
                            名前順（A → Z）
                        </option>

                        <option value="name-desc">
                            名前順（Z → A）
                        </option>

                    </select>

                </div>

            </div>



            <!-- =================================
                 TAG FILTER
            ================================== -->

            <div class="filter-box">

                <div class="filter-heading">

                    <label>
                        タグで絞り込み
                    </label>


                    <button
                        type="button"
                        id="clear-filters"
                        class="clear-button"
                    >
                        すべて解除
                    </button>

                </div>


                <div
                    id="tag-filters"
                    class="tag-filters"
                ></div>

            </div>



            <!-- =================================
                 ACTIVE FILTER
            ================================== -->

            <div
                id="active-filters"
                class="active-filters hidden"
            >

                <span class="active-label">
                    絞り込み：
                </span>


                <div
                    id="active-filter-list"
                    class="active-filter-list"
                ></div>

            </div>


        </section>



        <!-- =====================================
             SUBMIT WORK
        ====================================== -->

        <section class="submit-work-banner">


            <div class="submit-work-text">

                <p class="submit-work-label">
                    FOR CREATORS
                </p>


                <h2>
                    あなたの作品を提供しませんか？
                </h2>


                <p>
                    MFDCOでは、メンバーが制作した作品を
                    受け付けています。
                </p>

            </div>



            <a
                href="submit-work.html"
                class="submit-work-button"
            >

                <span>
                    作品を提供する
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>


        </section>



        <!-- =====================================
             WORKS LIST
        ====================================== -->

        <section class="works-section">


            <div class="works-section-heading">

                <div>

                    <p class="section-number">
                        WORKS
                    </p>


                    <h2>
                        作品一覧
                    </h2>

                </div>


                <p
                    id="works-count"
                    class="works-count"
                >
                    読み込み中...
                </p>

            </div>



            <!-- =================================
                 LOADING
            ================================== -->

            <div
                id="works-loading"
                class="works-message"
            >

                <div class="loading-spinner"></div>

                <p>
                    作品を読み込んでいます...
                </p>

            </div>



            <!-- =================================
                 ERROR
            ================================== -->

            <div
                id="works-error"
                class="works-message error hidden"
            >

                <h3>
                    作品を読み込めませんでした
                </h3>


                <p id="works-error-text">
                    データの取得中にエラーが発生しました。
                </p>

            </div>



            <!-- =================================
                 EMPTY
            ================================== -->

            <div
                id="works-empty"
                class="works-message hidden"
            >

                <h3>
                    作品が見つかりません
                </h3>


                <p>
                    検索条件やタグを変更してみてください。
                </p>

            </div>



            <!-- =================================
                 WORK GRID
            ================================== -->

            <div
                id="works-grid"
                class="works-grid"
            ></div>


        </section>


    </main>



    <!-- =========================================
         COMMON FOOTER
    ========================================== -->

    <div id="footer-container"></div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>

    <script src="js/header.js"></script>

    <script src="js/tags.js"></script>

    <script src="js/works.js"></script>


</body>

</html>
