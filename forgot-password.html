<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>パスワードを忘れた場合 | MFDCO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/join.css">
    <link rel="stylesheet" href="css/password-recovery.css">
</head>
<body data-mfdco-password-page="forgot">
    <div id="header-container"></div>
    <main>
        <section class="join-page mfdco-recovery-page">
            <div class="join-container">
                <div class="join-panel active mfdco-recovery-panel">
                    <p class="section-label">MFDCO ACCOUNT SECURITY</p>
                    <h1>パスワードを忘れた場合</h1>
                    <p class="mfdco-recovery-intro">
                        MFDCOに登録しているメールアドレスを入力してください。
                        登録されている場合、パスワード再設定用のメールが届きます。
                    </p>
                    <form id="mfdco-forgot-form" novalidate>
                        <div class="form-group">
                            <label for="mfdco-forgot-email">メールアドレス</label>
                            <input id="mfdco-forgot-email" name="email" type="email"
                                   required autocomplete="email" maxlength="254"
                                   placeholder="name@example.com">
                        </div>
                        <button class="join-submit" type="submit" id="mfdco-send-reset">
                            再設定メールを送信
                        </button>
                    </form>
                    <p id="mfdco-forgot-message" class="mfdco-recovery-message" role="status" aria-live="polite" hidden></p>
                    <p class="mfdco-recovery-back"><a href="join.html">ログイン画面に戻る</a></p>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/password-recovery.js"></script>
    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
