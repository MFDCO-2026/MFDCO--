<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MFDCO | 登録完了</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="header-container"></div>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="join-complete-page">

        <section class="join-complete-section">

            <div class="join-complete-container">


                <p class="section-label">
                    JOIN MFDCO
                </p>


                <h1>
                    登録が完了しました
                </h1>


                <div class="join-complete-line"></div>


                <p class="join-complete-message">

                    MFDCOへの参加登録ありがとうございます。

                    <br><br>

                    現在、登録内容は
                    <strong>審査待ち</strong>
                    となっています。

                    <br>

                    管理者による確認後、
                    正式な加盟状態へ変更されます。

                </p>



                <!-- =================================
                     DISCORD
                ================================== -->

                <div class="discord-box">

                    <p class="section-label">
                        MFDCO COMMUNITY
                    </p>

                    <h2>
                        Discordへの参加
                    </h2>

                    <p>
                        MFDCOのメンバーコミュニティへ
                        参加することができます。
                    </p>


                    <a
                        href="ここにDiscord招待URL"
                        class="join-large-button"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Discordに参加する
                        <span>→</span>
                    </a>

                </div>



                <!-- =================================
                     MY PAGE
                ================================== -->

                <a
                    href="mypage.html"
                    class="outline-button"
                >
                    マイページを見る
                    <span>→</span>
                </a>


            </div>

        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="footer-container"></div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>

    <script src="js/main.js"></script>


</body>

</html>
