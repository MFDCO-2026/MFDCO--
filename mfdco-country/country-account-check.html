<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MFDCOアカウント接続確認</title><link rel="stylesheet" href="css/country.css?v=20.8"></head><body><div class="country-shell"><div id="country-topbar"></div><main class="country-page"><div class="page-kicker">ACCOUNT CONNECTION</div><h1 class="page-title">MFDCOアカウント接続確認</h1><div id="auth-debug" class="card section-card">確認中…</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/supabase-config.js?v=mfdco-main"></script><script src="js/country-session.js?v=20.8"></script><script src="js/country-core.js?v=20.8"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const h=document.getElementById("auth-debug"),s=await MFDCOCountrySession.getState(true);h.innerHTML=`<div class="table-wrap"><table><tbody><tr><th>現在のOrigin</th><td>${location.origin}</td></tr><tr><th>Supabase</th><td>${window.supabaseClient?"接続済み":"未接続"}</td></tr><tr><th>ログイン</th><td>${s.user?"ログイン中":"ログアウト"}</td></tr><tr><th>活動名</th><td>${s.profile?.activity_name||"—"}</td></tr><tr><th>Account ID</th><td>${s.user?.id||"—"}</td></tr><tr><th>プロフィール</th><td>${s.profile?"取得済み":"未取得"}</td></tr></tbody></table></div>`});</script></body></html>
