<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        参加・ログイン | MFDCO
    </title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/header.css"
    >

</head>

<body>


    <!-- =========================================
         COMMON HEADER
    ========================================== -->

    <div id="header-container"></div>



    <!-- =========================================
         JOIN PAGE
    ========================================== -->

    <main>

        <section class="join-page">

            <div class="join-container">


                <!-- =================================
                     LOGIN
                ================================== -->

                <div
                    id="login-panel"
                    class="join-panel active"
                >

                    <p class="section-label">
                        MFDCO MEMBER
                    </p>

                    <h1>
                        ログイン
                    </h1>


                    <form id="login-form">

                        <div class="form-group">

                            <label for="login-email">
                                メールアドレス
                            </label>

                            <input
                                type="email"
                                id="login-email"
                                name="email"
                                required
                                autocomplete="email"
                            >

                        </div>


                        <div class="form-group">

                            <label for="login-password">
                                パスワード
                            </label>

                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                required
                                autocomplete="current-password"
                            >

                        </div>


                        <button
                            type="submit"
                            class="join-submit"
                        >
                            ログイン
                        </button>

                    </form>


                    <div class="join-switch">

                        <span>
                            MFDCOに新しく参加する
                        </span>

                        <button
                            type="button"
                            id="show-register"
                        >
                            新規参加
                        </button>

                    </div>

                </div>



                <!-- =================================
                     REGISTER
                ================================== -->

                <div
                    id="register-panel"
                    class="join-panel"
                >

                    <p class="section-label">
                        JOIN MFDCO
                    </p>

                    <h1>
                        MFDCOに参加する
                    </h1>


                    <p class="form-note">
                        最初にMFDCOアカウントを作成します。
                        登録後、ご入力いただいたメールアドレスへ
                        確認メールを送信します。
                    </p>


                    <form id="register-form">


                        <!-- ACCOUNT -->

                        <div class="form-section">

                            <h2>
                                アカウント
                            </h2>


                            <div class="form-group">

                                <label for="email">
                                    メールアドレス
                                    <span>*</span>
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                    autocomplete="email"
                                >

                            </div>


                            <div class="form-group">

                                <label for="password">
                                    パスワード
                                    <span>*</span>
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    required
                                    minlength="8"
                                    autocomplete="new-password"
                                >

                                <p class="form-note">
                                    8文字以上で設定してください。
                                </p>

                            </div>


                            <div class="form-group">

                                <label for="password-confirm">
                                    パスワード確認
                                    <span>*</span>
                                </label>

                                <input
                                    type="password"
                                    id="password-confirm"
                                    name="password_confirm"
                                    required
                                    minlength="8"
                                    autocomplete="new-password"
                                >

                                <p
                                    id="password-error"
                                    class="form-error"
                                ></p>

                            </div>

                        </div>



                        <!-- FLOW -->

                        <div class="form-section">

                            <h2>
                                登録の流れ
                            </h2>

                            <p class="form-note">
                                1. アカウントを作成します。<br>
                                2. MFDCOから確認メールが届きます。<br>
                                3. メール内の確認リンクを開きます。<br>
                                4. 活動名・アイコンなどのプロフィールを登録します。
                            </p>

                        </div>



                        <!-- AGREEMENT -->

                        <div class="agreement">

                            <label>

                                <input
                                    type="checkbox"
                                    id="agreement"
                                    name="agreement"
                                    required
                                >

                                MFDCO利用規約に同意します。

                            </label>

                        </div>


                        <button
                            type="submit"
                            class="join-submit"
                        >
                            確認メールを送信する
                        </button>


                    </form>


                    <div class="join-switch">

                        <span>
                            すでにアカウントをお持ちですか？
                        </span>

                        <button
                            type="button"
                            id="show-login"
                        >
                            ログイン
                        </button>

                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- =========================================
         COMMON FOOTER
    ========================================== -->

    <div id="footer-container"></div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/join.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
