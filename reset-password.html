<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>新しいパスワードの設定 | MFDCO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/join.css">
    <link rel="stylesheet" href="css/password-recovery.css">
</head>
<body data-mfdco-password-page="reset">
    <div id="header-container"></div>
    <main>
        <section class="join-page mfdco-recovery-page">
            <div class="join-container">
                <div class="join-panel active mfdco-recovery-panel">
                    <p class="section-label">MFDCO ACCOUNT SECURITY</p>
                    <h1>新しいパスワードの設定</h1>
                    <p class="mfdco-recovery-intro">
                        メール内のリンクを認証した後、新しいパスワードを登録できます。
                    </p>
                    <p id="mfdco-reset-message" class="mfdco-recovery-message"
                       role="status" aria-live="polite">認証リンクを確認しています...</p>
                    <form id="mfdco-reset-form" hidden novalidate>
                        <div class="form-group">
                            <label for="mfdco-reset-password">新しいパスワード</label>
                            <input id="mfdco-reset-password" name="password"
                                   type="password" required autocomplete="new-password"
                                   minlength="8" placeholder="8文字以上">
                        </div>
                        <div class="form-group">
                            <label for="mfdco-reset-password-confirm">新しいパスワード（確認）</label>
                            <input id="mfdco-reset-password-confirm" name="passwordConfirm"
                                   type="password" required autocomplete="new-password"
                                   minlength="8">
                        </div>
                        <p class="mfdco-recovery-help">8文字以上を推奨します。推測されやすい文字列や使い回しは避けてください。</p>
                        <button class="join-submit" type="submit" id="mfdco-save-password">
                            パスワードを変更
                        </button>
                    </form>
                    <p class="mfdco-recovery-back"><a href="forgot-password.html">再設定メールを送り直す</a></p>
                    <p class="mfdco-recovery-back"><a href="join.html">ログイン画面に戻る</a></p>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/password-recovery.js"></script>
    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
